# Local In-Memory H2 Development Profile (Zero setup - No MySQL required!)
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:office_admin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Spring Security default credentials
spring.security.user.name=admin
spring.security.user.password=admin123

# Allow H2 console for easy debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

