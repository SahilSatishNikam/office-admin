spring.application.name=office-admin

# Cloud Dynamic Port & Datasource Configuration
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:office_admin}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:sahil}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security default credentials
spring.security.user.name=admin
spring.security.user.password=admin123

# LinkedIn OAuth 2.0 Configuration
# Register app at https://www.linkedin.com/developers/apps
social.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
social.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
social.linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/oauth2/callback/linkedin}

# Instagram / Meta Graph API Configuration
# Register app at https://developers.facebook.com/apps/
social.instagram.client-id=${INSTAGRAM_CLIENT_ID:}
social.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
social.instagram.redirect-uri=${INSTAGRAM_REDIRECT_URI:http://localhost:8080/oauth2/callback/instagram}

# X (Twitter) OAuth 2.0 Configuration
# Register app at https://developer.x.com/en/portal/dashboard
social.twitter.client-id=${TWITTER_CLIENT_ID:}
social.twitter.client-secret=${TWITTER_CLIENT_SECRET:}
social.twitter.redirect-uri=${TWITTER_REDIRECT_URI:http://localhost:8080/oauth2/callback/twitter}

# Facebook OAuth 2.0 Configuration
# Register app at https://developers.facebook.com/apps/
social.facebook.client-id=${FACEBOOK_CLIENT_ID:}
social.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
social.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/oauth2/callback/facebook}

# YouTube (Google) OAuth 2.0 Configuration
# Register app at https://console.cloud.google.com/apis/credentials
social.youtube.client-id=${YOUTUBE_CLIENT_ID:}
social.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
social.youtube.redirect-uri=${YOUTUBE_REDIRECT_URI:http://localhost:8080/oauth2/callback/youtube}

# TikTok OAuth 2.0 Configuration
# Register app at https://developers.tiktok.com/
social.tiktok.client-id=${TIKTOK_CLIENT_ID:}
social.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
social.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:http://localhost:8080/oauth2/callback/tiktok}

