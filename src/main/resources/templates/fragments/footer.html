        <span class="system-status-indicator">
            <span class="status-pulse-dot"></span>

        </span>
    </div>
    <div class="footer-right">
        <span class="copyright">&copy; 2026 CodeMetric Inc. All rights reserved.</span>
        <span class="footer-separator">&bull;</span>
        <a th:href="@{/dashboard}" class="footer-link">Documentation</a>
