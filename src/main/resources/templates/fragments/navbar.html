<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

    <header th:fragment="navbar" class="top-navbar">
        <div class="navbar-left">
            <!-- Mobile Sidebar Toggle -->
            <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Toggle navigation menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="globalSearchInput" class="search-input"
                        placeholder="Search posts, analytics, campaigns..." aria-label="Search posts and analytics" autocomplete="off">
                    <kbd class="search-shortcut">Ctrl K</kbd>
                    <!-- Global Search Results Dropdown -->
                    <div class="search-results-dropdown" id="searchResultsDropdown" style="display: none;"></div>
                </div>
            </div>
        </div>

        <div class="navbar-right">
            <!-- Quick Action: Create Post (Admin + Creator) / Add Asset (Designer) -->
            <button th:if="${userRoleAuthority == null or userRoleAuthority == 'ROLE_ADMIN' or userRoleAuthority == 'ROLE_CREATOR'}"
                    type="button" class="btn btn-primary create-post-btn" id="createPostBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span class="btn-text">Create Post</span>
            </button>
            <button th:if="${userRoleAuthority == 'ROLE_DESIGNER'}"
                    type="button" class="btn btn-primary create-post-btn btn-designer-accent" id="navAddDesignerBtn"
                    onclick="const m = document.getElementById('addDesignerAssetModal'); if(m){ m.classList.add('show'); m.setAttribute('aria-hidden', 'false'); }">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span class="btn-text">Add Asset</span>
            </button>

            <!-- Dark / Light Theme Toggle Button -->
            <button type="button" class="nav-icon-btn theme-toggle-btn" id="themeToggleBtn"
                    aria-label="Toggle light and dark mode" title="Toggle theme (Light / Dark)">
                <!-- Sun icon (shown in dark mode) -->
                <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- Notifications Dropdown -->
            <div class="dropdown-wrapper" id="notificationsDropdownWrapper">
                <button type="button" class="nav-icon-btn notification-btn" id="notificationBtn"
                    aria-label="View notifications" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-indicator-badge"
                        th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                        th:text="${unreadNotificationCount}">3</span>
                </button>

                <!-- Notifications Menu -->
                <div class="dropdown-menu notifications-menu" id="notificationsMenu">
                    <div class="dropdown-header">
                        <div>
                            <h4 class="dropdown-title">Notifications</h4>
                            <span class="dropdown-subtitle" th:text="${unreadNotificationCount + ' unread updates'}">3
                                unread updates</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button type="button" class="mark-read-btn" id="markAllReadBtn" title="Mark all as read">Mark read</button>
                            <button type="button" class="clear-all-notif-btn" id="clearAllNotificationsBtn" title="Permanently delete all notifications from database" style="background: none; border: none; color: var(--danger, #ef4444); font-size: 11px; font-weight: 600; cursor: pointer; padding: 3px 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 3px; transition: background 0.15s;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                <span>Clear all</span>
                            </button>
                        </div>
                    </div>
                    <div class="notifications-list" id="notificationsListContainer">
                        <div th:if="${notifications == null or notifications.isEmpty()}" class="notif-empty-state" style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">
                            No notifications right now
                        </div>
                        <th:block th:each="n : ${notifications}">
                            <div class="notification-item" th:classappend="${n.unread} ? 'unread' : ''" th:id="'notif-item-' + ${n.id}">
                                <div class="notif-icon-circle" th:classappend="'type-' + ${n.type}">
                                    <svg th:if="${n.type == 'trend'}" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                                    </svg>
                                    <svg th:if="${n.type == 'review'}" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    </svg>
                                    <svg th:if="${n.type == 'milestone'}" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="8" r="7"></circle>
                                        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                                    </svg>
                                    <svg th:if="${n.type == 'schedule'}" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                </div>
                                <div class="notif-content">
                                    <div class="notif-top">
                                        <span class="notif-title" th:text="${n.title}">Alert</span>
                                        <span class="notif-time" th:text="${n.timeAgo}">12m ago</span>
                                    </div>
                                    <p class="notif-text" th:text="${n.message}">Message</p>
                                </div>
                                <button type="button" class="notif-delete-btn" th:data-id="${n.id}" title="Permanently delete notification" aria-label="Delete notification">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="18" x2="18" y2="6"></line>
                                    </svg>
                                </button>
                            </div>
                        </th:block>
                    </div>
                    <div class="dropdown-footer">
                        <a th:href="@{/dashboard}" class="view-all-link">View all activity</a>
                    </div>
                </div>
            </div>

            <!-- User Profile Dropdown -->
            <div class="dropdown-wrapper" id="profileDropdownWrapper">
                <button type="button" class="user-profile-btn" id="userProfileBtn" aria-label="User account menu"
                    aria-expanded="false">
                    <div class="user-avatar" th:text="${userInitials != null ? userInitials : 'SP'}">SP</div>
                    <div class="user-info-text">
                        <span class="user-name" th:text="${userName != null ? userName : 'Shrushti'}">Shrushti</span>
                        <span class="user-role" th:text="${userRole != null ? userRole : 'Social Media Director'}">Social Media Director</span>
                    </div>
                    <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <!-- User Menu with Logout -->
                <div class="dropdown-menu profile-menu" id="profileMenu">
                    <div class="profile-menu-header">
                        <div class="user-avatar-lg" th:text="${userInitials != null ? userInitials : 'SP'}">SP</div>
                        <div class="profile-header-text">
                            <strong class="profile-header-name"
                                th:text="${userName != null ? userName : 'Shrushti'}">Shrushti</strong>
                            <span class="profile-header-email"
                                th:text="${userEmail != null ? userEmail : 'shrushti@company.com'}">shrushti@company.com</span>
                        </div>
                    </div>
                    <div class="profile-menu-items">
                        <a th:href="@{/settings}" class="profile-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <span>My Profile</span>
                        </a>
                        <a th:href="@{/settings}" class="profile-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                </path>
                            </svg>
                            <span>Workspace Settings</span>
                        </a>
                        <a th:href="@{/dashboard}" class="profile-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                            <span>Support & Docs</span>
                        </a>

                        <div class="profile-divider"></div>

                        <!-- Spring Security CSRF-Protected Logout Form -->
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="logout-submit-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                <span>Sign out</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>

</body>

</html>
