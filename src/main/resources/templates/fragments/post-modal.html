<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="postModal" class="modal-overlay" id="createPostModal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-header">
            <div class="modal-title-group">
                <h3 class="modal-title" id="postModalTitle">Create &amp; Schedule Post</h3>
                <p class="modal-subtitle" style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                    Publish or queue content across your connected social channels
                </p>
            </div>
            <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Close dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="12" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <form id="createPostForm">
            <div class="modal-body">
                <div class="channel-select-group">
                    <label class="form-label">Select Channels</label>
                    <div class="channel-checkbox-pills">
                        <label class="channel-check-pill selected">
                            <input type="checkbox" name="channels" value="Instagram" checked>
                            <span>Instagram</span>
                        </label>
                        <label class="channel-check-pill selected">
                            <input type="checkbox" name="channels" value="LinkedIn" checked>
                            <span>LinkedIn</span>
                        </label>
                        <label class="channel-check-pill selected">
                            <input type="checkbox" name="channels" value="Twitter" checked>
                            <span>X (Twitter)</span>
                        </label>
                        <label class="channel-check-pill">
                            <input type="checkbox" name="channels" value="YouTube">
                            <span>YouTube Community</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="postContentInput" class="form-label">Post Caption / Content</label>
                    <textarea id="postContentInput" name="content" class="form-textarea" rows="4" required
                        placeholder="Write your caption or update to share..."></textarea>
                    <div class="textarea-footer">
                        <span class="char-count" id="charCountSpan">0 / 2,200 chars</span>
                        <div class="media-quick-add" id="mediaTypeSelectorGroup">
                            <label class="media-btn active" id="btnMediaImage" title="Attach Image">
                                <input type="radio" name="mediaType" value="Single Image" checked style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <span>Image</span>
                            </label>
                            <label class="media-btn" id="btnMediaVideo" title="Attach Video">
                                <input type="radio" name="mediaType" value="Video" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                </svg>
                                <span>Video</span>
                            </label>
                            <label class="media-btn" id="btnMediaCarousel" title="Carousel format">
                                <input type="radio" name="mediaType" value="Document Carousel" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="2" width="16" height="16" rx="2"></rect>
                                    <path d="M6 18h12"></path>
                                    <path d="M6 22h12"></path>
                                </svg>
                                <span>Carousel</span>
                            </label>
                            <label class="media-btn" id="btnMediaText" title="Text only">
                                <input type="radio" name="mediaType" value="Text Update" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="17" y1="10" x2="3" y2="10"></line>
                                    <line x1="21" y1="6" x2="3" y2="6"></line>
                                    <line x1="21" y1="14" x2="3" y2="14"></line>
                                    <line x1="17" y1="18" x2="3" y2="18"></line>
                                </svg>
                                <span>Text</span>
                            </label>
                        </div>
                    </div>

                    <!-- Media Attachment Box (Image / Video Upload & Preview) -->
                    <div id="mediaUploadBox" class="media-upload-container"
                        style="margin-top: 12px; border: 2px dashed var(--border-color); border-radius: var(--radius-md); padding: 16px; background: var(--bg-subtle, #f8fafc); transition: all 0.2s;">
                        <input type="file" id="mediaFileInput" accept="image/*" style="display: none;">
                        <input type="hidden" id="postMediaUrlInput" name="mediaUrl">

                        <!-- Prompt State -->
                        <div id="mediaUploadPrompt"
                            style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
                            <div id="mediaUploadIcon" style="color: var(--primary);">
                                <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </div>
                            <div style="font-size: 13px; font-weight: 600; color: var(--text-primary);">
                                <button type="button" class="btn btn-secondary" id="browseMediaBtn"
                                    style="padding: 4px 12px; font-size: 12px; margin-right: 6px;">
                                    Choose <span id="mediaTypeLabel">Image</span>
                                </button>
                                or drag &amp; drop file here
                            </div>
                            <span style="font-size: 11px; color: var(--text-muted);" id="mediaFormatHint">Supports PNG, JPG, WEBP, GIF (Max 25MB)</span>

                            <div style="display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; margin-top: 6px;">
                                <input type="url" id="mediaUrlDirectInput" class="form-input"
                                    style="padding: 6px 10px; font-size: 12px;"
                                    placeholder="Or paste public image/video URL...">
                                <button type="button" class="btn btn-secondary" id="applyMediaUrlBtn"
                                    style="padding: 6px 12px; font-size: 12px; white-space: nowrap;">Attach</button>
                            </div>
                        </div>

                        <!-- Preview State -->
                        <div id="mediaPreviewWrapper" style="display: none; position: relative; text-align: center;">
                            <img id="imagePreviewElement" src="" alt="Post media preview"
                                style="max-height: 180px; max-width: 100%; border-radius: 8px; object-fit: contain; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; margin: 0 auto;">
                            <video id="videoPreviewElement" controls
                                style="max-height: 180px; max-width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; margin: 0 auto;"></video>
                            <div style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 12px;">
                                <span id="mediaFileNameBadge" style="font-size: 12px; color: var(--text-muted); font-weight: 600;"></span>
                                <button type="button" id="removeMediaBtn" class="btn btn-secondary"
                                    style="padding: 4px 12px; font-size: 11px; color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">
                                    Remove Media
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group half-col">
                        <label class="form-label">Publishing Option</label>
                        <select class="form-select" id="publishOptionSelect" name="publishOption">
                            <option value="schedule" selected>Schedule for Later</option>
                            <option value="now">Publish Immediately</option>
                            <option value="draft">Save as Draft</option>
                        </select>
                    </div>
                    <div class="form-group half-col" id="scheduleDateTimeGroup">
                        <label class="form-label">Date &amp; Time</label>
                        <input type="datetime-local" class="form-input" id="scheduleDateTimeInput"
                            name="scheduledDateTime">
                    </div>
                </div>

                <!-- Reminder Alert Options (Email & SMS/MSG) -->
                <div id="scheduleReminderOptionsBox"
                    style="margin-top: 12px; padding: 14px; background: var(--bg-subtle, #f8fafc); border: 1px solid var(--border-color); border-radius: var(--radius-md);">
                    <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                        <span>🔔 Post Reminder Alerts</span>
                        <span style="font-size: 11px; font-weight: 500; color: var(--text-muted);">(Email &amp; Mobile MSG)</span>
                    </div>
                    <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px;">
                        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">
                            <input type="checkbox" id="postRemindEmailCheckbox" name="remindEmail" value="true" checked>
                            <span>📧 Email Reminder</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">
                            <input type="checkbox" id="postRemindSmsCheckbox" name="remindSms" value="true" checked>
                            <span>📱 SMS / WhatsApp MSG</span>
                        </label>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group" style="margin: 0;">
                            <label style="font-size: 11px; font-weight: 600; color: var(--text-muted);">Alert Timing</label>
                            <select class="form-select" id="postReminderTimingSelect" name="reminderMinutesBefore"
                                style="padding: 6px 10px; font-size: 12px;">
                                <option value="15" selected>15m before publish</option>
                                <option value="30">30m before publish</option>
                                <option value="60">1h before publish</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin: 0;">
                            <label style="font-size: 11px; font-weight: 600; color: var(--text-muted);">Recipient Phone / Email</label>
                            <input type="text" class="form-input" id="postRecipientContactInput"
                                placeholder="Default user contact" style="padding: 6px 10px; font-size: 12px;">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">
                    <span>Schedule Post</span>
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
