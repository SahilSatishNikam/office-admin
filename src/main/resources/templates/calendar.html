<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Theme & Color Scheme (Supports Dark / Light Mode) -->
    <meta name="color-scheme" content="light dark">
    <script>
        (function() {
            try {
                var s = localStorage.getItem('theme') || localStorage.getItem('color-scheme');
                if (s === 'dark' || (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    var m = document.querySelector('meta[name="color-scheme"]');
                    if (m) m.content = 'dark';
                } else if (s === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    var m = document.querySelector('meta[name="color-scheme"]');
                    if (m) m.content = 'light';
                }
            } catch(e) {}
        })();
    </script>
    <title th:text="${pageTitle != null ? pageTitle : 'Content Calendar'}">Content Calendar</title>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        .cal-header-cell {
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .cal-day-cell {
            min-height: 110px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px;
            display: flex;
            flex-direction: column;
            transition: all var(--transition-fast);
            cursor: pointer;
        }
        .cal-day-cell:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .cal-day-cell.today {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.03);
        }
        .cal-day-cell.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }
        .cal-day-num {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .cal-day-cell.today .cal-day-num {
            display: inline-block;
            background: var(--primary);
            color: #ffffff;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
        }
        .cal-post-chip {
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chip-linkedin { background: rgba(10, 102, 194, 0.15); color: #0a66c2; border-left: 3px solid #0a66c2; }
        .chip-instagram { background: rgba(225, 48, 108, 0.15); color: #e1306c; border-left: 3px solid #e1306c; }
        .chip-twitter { background: rgba(29, 161, 242, 0.15); color: #1da1f2; border-left: 3px solid #1da1f2; }
        .chip-youtube { background: rgba(255, 0, 0, 0.15); color: #ff0000; border-left: 3px solid #ff0000; }
    </style>
</head>
<body class="dashboard-body">

    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Top Navigation Bar -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <!-- Page Content -->
            <main class="dashboard-content dashboard-main">

                <!-- Page Header with Month Navigation -->
                <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
                    <div>
                        <h1 class="welcome-title" th:text="${monthTitle}">Month Year</h1>
                        <p class="welcome-subtitle">Live automated publishing queue visualized across your calendar.</p>
                    </div>

                    <div style="display: flex; align-items: center; gap: 12px;">
                        <!-- Prev / Next Month Controls -->
                        <div style="display: inline-flex; border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-card);">
                            <a th:href="@{/calendar(year=${prevYear}, month=${prevMonth})}" class="btn-icon-subtle" style="border-radius: 0; padding: 8px 12px;" title="Previous Month">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            </a>
                            <a th:href="@{/calendar}" class="btn-icon-subtle" style="border-radius: 0; padding: 8px 14px; font-size: 13px; font-weight: 600;" title="Today">Today</a>
                            <a th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}" class="btn-icon-subtle" style="border-radius: 0; padding: 8px 12px;" title="Next Month">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </a>
                        </div>

                        <button type="button" class="btn btn-primary schedule-post-btn create-post-btn" id="calendarSchedulePostBtn" style="display: inline-flex; align-items: center; gap: 8px;">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            <span>Schedule Post</span>
                        </button>
                    </div>
                </div>

                <!-- Calendar Card -->
                <div class="dashboard-card" style="padding: 24px;">
                    <!-- Days of Week Header -->
                    <div class="calendar-grid" style="margin-bottom: 8px;">
                        <div class="cal-header-cell">Mon</div>
                        <div class="cal-header-cell">Tue</div>
                        <div class="cal-header-cell">Wed</div>
                        <div class="cal-header-cell">Thu</div>
                        <div class="cal-header-cell">Fri</div>
                        <div class="cal-header-cell">Sat</div>
                        <div class="cal-header-cell">Sun</div>
                    </div>

                    <!-- Days Grid -->
                    <div class="calendar-grid">
                        <!-- Leading empty cells -->
                        <th:block th:if="${leadEmptyDays > 0}">
                            <div th:each="i : ${#numbers.sequence(1, leadEmptyDays)}" class="cal-day-cell empty"></div>
                        </th:block>

                        <!-- Days of Month -->
                        <th:block th:each="day : ${#numbers.sequence(1, daysInMonth)}">
                            <div class="cal-day-cell" th:classappend="${day == todayDay} ? 'today' : ''" th:data-day="${day}">
                                <span class="cal-day-num" th:text="${day}">1</span>

                                <!-- Real scheduled posts for this date -->
                                <th:block th:if="${postsByDay.containsKey(day)}">
                                    <div th:each="p : ${postsByDay.get(day)}" class="cal-post-chip" th:classappend="'chip-' + ${p.platformClass}" th:title="${p.platform + ': ' + p.caption}">
                                        <strong th:text="${p.platform}">IG</strong>
                                        <span th:text="${p.title != null ? p.title : p.caption}">Post</span>
                                    </div>
                                </th:block>
                            </div>
                        </th:block>
                    </div>

                    <!-- Empty Queue Notice -->
                    <div th:if="${totalScheduled == 0}" style="margin-top: 24px; padding: 20px; text-align: center; background: rgba(0,0,0,0.015); border-radius: var(--radius-md); color: var(--text-muted); font-size: 13px;">
                        No posts scheduled for this month. Click any date or 'Schedule Post' to queue an update.
                    </div>
                </div>

            </main>

            <!-- Footer -->
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
    <script>
        // Clicking on a calendar day pre-selects that date in the schedule modal
        document.querySelectorAll('.cal-day-cell:not(.empty)').forEach(cell => {
            cell.addEventListener('click', function() {
                const day = this.getAttribute('data-day');
                const year = "[[${currentYear}]]";
                const month = "[[${currentMonth}]]".padStart(2, '0');
                const paddedDay = day.padStart(2, '0');
                const preset = `${year}-${month}-${paddedDay}T10:00`;
                if (typeof window.openCreatePostModal === 'function') {
                    window.openCreatePostModal(preset, 'schedule');
                } else {
                    const input = document.getElementById('scheduleDateTimeInput');
                    if (input) input.value = preset;
                    const modal = document.getElementById('createPostModal');
                    if (modal) modal.classList.add('show');
                }
            });
        });

        const form = document.getElementById('createPostForm');
        if (form) {
            form.addEventListener('submit', function() {
                setTimeout(() => window.location.reload(), 800);
            });
        }
    </script>
</body>
</html>
